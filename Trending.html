<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trending - CineGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="navbar">
    <div class="container navbar-inner">
      <input type="checkbox" id="navToggle" class="nav-Toggle">
      <label for="navToggle" class="navToggleMenu">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <a href="Home.html" class="logo-link">
        <img src="Images/logo.png" alt="CineGo Logo" class="logo" />
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="Home.html">Home</a></li>
          <li><a href="Schedule.html">Schedule</a></li>
          <li><a href="MyTicket.html">MyTicket</a></li>
          <li><a href="MyAccount.html">MyAccount</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="trending-section">
      <h2 class="section-title">Film Trending</h2>
      <p class="section-desc">Peringkat film populer minggu ini berdasarkan vote pengguna.</p>

      <!-- ── Controls ─────────────────────────────────────────────────── -->
      <div class="trend-controls">
        <div class="trend-search-wrap">
          <span class="trend-search-icon">🔍</span>
          <input type="text" id="trendSearch" placeholder="Cari judul, genre, sutradara, atau pemain…" />
        </div>
        <div class="genre-pills" id="genrePills"></div>
        <div class="sort-view-row">
          <div class="sort-left">
            <select class="sort-select" id="sortSelect">
              <option value="votes">🔥 Terpopuler</option>
              <option value="rating">⭐ Rating Tertinggi</option>
              <option value="durasi_asc">⏱ Durasi Terpendek</option>
              <option value="durasi_desc">⏱ Durasi Terlama</option>
              <option value="az">🔤 A – Z</option>
            </select>
            <span class="result-count" id="resultCount"></span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="view-btns">
              <button class="view-btn active" id="btnViewGrid" title="Tampilan Grid">⊞</button>
              <button class="view-btn"        id="btnViewList" title="Tampilan List">≡</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Stats bar ──────────────────────────────────────────────────── -->
      <div class="trend-stats" id="trendStats"></div>

      <!-- ── Film container ─────────────────────────────────────────────── -->
      <div id="trendContainer"></div>
    </section>
  </main>

  <!-- ── Film Detail Modal ────────────────────────────────────────────────── -->
  <div class="film-modal-overlay" id="filmModalOverlay">
    <div class="film-modal" id="filmModal">
      <button class="modal-close-btn" id="btnModalClose" aria-label="Tutup">✕</button>
      <div class="modal-body">

        <div class="modal-hero-row">
          <img id="mPoster" class="modal-poster" src="" alt="" />
          <div class="modal-header">
            <h3 class="modal-film-title" id="mTitle"></h3>
            <div class="modal-rating-row" id="mRating"></div>
            <div class="modal-pills" id="mPills"></div>
          </div>
        </div>

        <p class="modal-section-lbl">Sinopsis</p>
        <p class="modal-sinopsis" id="mSinopsis"></p>

        <p class="modal-section-lbl">Info Film</p>
        <div class="modal-info-grid" id="mInfoGrid"></div>

        <div class="modal-vote-bar">
          <div>
            <div class="modal-vote-big" id="mVoteNum">0</div>
            <div class="modal-vote-sub">vote pengguna minggu ini</div>
          </div>
          <button class="btn-modal-vote" id="btnModalVote">🔥 Vote Film Ini</button>
        </div>

        <div class="modal-action-row">
          <button class="btn-modal-wl" id="btnModalWl">🤍 Simpan ke Wishlist</button>
          <a class="btn-modal-book" id="btnModalBook" href="#">🎬 Pesan Tiket</a>
        </div>

      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    <p>&copy; 2026 CineGo. All rights reserved</p>
    <p>
      <a href="About-Us.html">About Us</a> |
      <a href="Contact-Us.html">Contact Us</a> |
      <a href="Trending.html" class="active">Trending</a>
    </p>
    <div class="arrow">
      <a href="#">^</a>
    </div>
  </footer>
  <script src="js/app.js"></script>

</body>

</html>
